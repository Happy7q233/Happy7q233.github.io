<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock</title>
  <link rel="icon" href="https://files.happy7q233.net/favicon.ico">
<style>
  :root { --bg: #f5f5f3; --fg: #161616; --dim: #8a8a86; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111111; --fg: #ececea; --dim: #777773; }
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  #clock { font-size: clamp(3rem, 19vw, 16rem); white-space: nowrap; font-weight: 200; letter-spacing: -0.02em; }
  #clock small { font-size: 0.3em; margin-left: 0.2em; color: var(--dim); letter-spacing: 0; }
  #stopwatch { position: fixed; bottom: 1.5rem; font-size: clamp(1.5rem, 4vw, 2.5rem); color: var(--dim); }
</style>
</head>
<body>
  <div id="clock"></div>
  <div id="stopwatch">00:00:00</div>

<script>
  var pad = function (n) { return String(n).padStart(2, "0"); };
  var start = Date.now();

  function tick() {
    var d = new Date();
    var h = d.getHours() % 12 || 12;
    var ampm = d.getHours() < 12 ? "AM" : "PM";
    document.getElementById("clock").innerHTML =
      h + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()) + "<small>" + ampm + "</small>";

    var s = Math.floor((Date.now() - start) / 1000);
    document.getElementById("stopwatch").textContent =
      pad(Math.floor(s / 3600)) + ":" + pad(Math.floor(s / 60) % 60) + ":" + pad(s % 60);
  }
  tick();
  setInterval(tick, 250);
  document.addEventListener("visibilitychange", tick);

  // Click anywhere to toggle full screen
  document.addEventListener("click", function () {
    try {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen();
      }
    } catch (e) {}
  });

  // Keep the screen awake while this tab is visible
  var lock = null;
  async function keepAwake() {
    try {
      if ("wakeLock" in navigator && document.visibilityState === "visible") {
        lock = await navigator.wakeLock.request("screen");
      }
    } catch (e) {}
  }
  keepAwake();
  document.addEventListener("visibilitychange", keepAwake);
</script>
</body>
</html>
