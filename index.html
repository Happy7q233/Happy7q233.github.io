<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tools</title>
<style>
  :root { --bg: #f5f5f3; --fg: #161616; --dim: #8a8a86; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111111; --fg: #ececea; --dim: #777773; }
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    display: flex; align-items: center; justify-content: center;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  nav { display: flex; flex-direction: column; gap: 1rem; align-items: center; }
  a { color: var(--fg); text-decoration: none; font-size: clamp(2rem, 8vw, 4rem); font-weight: 200; letter-spacing: -0.02em; }
  a:hover, a:focus-visible { color: var(--dim); outline: none; }
</style>
</head>
<body>
  <nav>
    <a href="clock/">Clock</a>
  </nav>
</body>
</html>
