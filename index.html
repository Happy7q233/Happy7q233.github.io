<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tools</title>
<link rel="icon" href="https://files.happy7q233.net/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@200;300;400&display=swap">
<style>
  :root { --bg: #f5f5f3; --fg: #161616; --dim: #8a8a86; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111111; --fg: #ececea; --dim: #777773; }
  }
  html, body { height: 100%; margin: 0; }
  body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--fg);
    display: flex; align-items: center; justify-content: center;
    font-family: "Spectral", Georgia, "Times New Roman", serif;
  }
  nav { display: flex; flex-direction: column; gap: 0.15rem; align-items: center; }
  nav a { line-height: 1.1; }
  a { color: var(--fg); text-decoration: none; font-size: clamp(2rem, 8vw, 4rem); font-weight: 200; letter-spacing: -0.02em; }
  a:hover, a:focus-visible { color: var(--dim); outline: none; }
  #gh { position: fixed; bottom: 1.5rem; right: 1.5rem; width: 1.75rem; height: 1.75rem; color: var(--dim); }
  #gh:hover, #gh:focus-visible { color: var(--fg); }
  #gh svg { display: block; width: 100%; height: 100%; fill: currentColor; }
</style>
