<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time</title>
<link rel="icon" href="https://files.happy7q233.net/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@200;300;400&display=swap">
<style>
  :root { --bg: #f5f5f3; --fg: #161616; --dim: #8a8a86; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111111; --fg: #ececea; --dim: #777773; }
  }
  html, body { height: 100%; margin: 0; }
  body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--fg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Spectral", Georgia, "Times New Roman", serif;
    font-variant-numeric: lining-nums tabular-nums;
  }
  #clock { font-size: clamp(3rem, 19vw, 16rem); line-height: 1; white-space: nowrap; font-weight: 200; letter-spacing: -0.02em; }
  #clock small { display: inline-block; vertical-align: middle; font-size: 0.3em; line-height: 1.15; margin-left: 0.25em; color: var(--dim); letter-spacing: 0; text-align: left; }
  #clock small span { display: block; }
  #hms, #ap { cursor: pointer; }
  html:not(.keys) #ap:hover { color: var(--fg); }
  #wrap { position: relative; }
  #meta { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); white-space: nowrap;
    font-size: clamp(1.25rem, 4vw, 3rem); color: var(--dim); letter-spacing: 0.05em; margin-bottom: 0; }
  #stopwatch { position: fixed; bottom: 1.5rem; font-size: clamp(1.5rem, 4vw, 2.5rem); color: var(--dim); }
  html.idle, html.idle * { cursor: none !important; }
  #gh { position: fixed; bottom: 1.5rem; right: 1.5rem; width: 1.75rem; height: 1.75rem; color: var(--dim); }
  #gh:hover, #gh:focus-visible { color: var(--fg); }
  #gh svg { display: block; width: 100%; height: 100%; fill: currentColor; }
  #menu { position: fixed; top: 1.5rem; left: 1.5rem; width: 1.75rem; height: 1.75rem; color: var(--dim); }
  #menu:hover, #menu:focus-visible { color: var(--fg); }
  #menu svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }
</style>
</head>
<body>
  <div id="wrap">
    <div id="meta"></div>
    <div id="clock"><span id="hms"></span><small><span id="ap" role="button" title="Switch between 12 and 24 hour"></span><span id="tzn"></span></small></div>
  </div>
  <div id="stopwatch">0</div>
  <a id="gh" tabindex="-1" href="https://github.com/Happy7q233/Happy7q233.github.io" target="_blank" rel="noopener" aria-label="GitHub repository">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
  </a>
  <a id="menu" tabindex="-1" href="../" aria-label="Back to menu">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </a>

<script>
  var pad = function (n) { return String(n).padStart(2, "0"); };
  // Start on a whole second so the stopwatch ticks in step with the clock
  var start = Math.floor(Date.now() / 1000) * 1000;
  // 12/24 hour mode, remembered between visits
  var use24 = false;
  try { use24 = localStorage.getItem("clock24") === "1"; } catch (e) {}
  var DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

  // Abbreviations for zones without daylight saving that browsers show as GMT+X
  var ABBR = {
    "Asia/Singapore": "SGT", "Asia/Kuala_Lumpur": "MYT", "Asia/Tokyo": "JST",
    "Asia/Seoul": "KST", "Asia/Hong_Kong": "HKT", "Asia/Shanghai": "CST",
    "Asia/Taipei": "CST", "Asia/Kolkata": "IST", "Asia/Calcutta": "IST",
    "Asia/Bangkok": "ICT", "Asia/Ho_Chi_Minh": "ICT", "Asia/Jakarta": "WIB",
    "Asia/Manila": "PHT", "Asia/Dubai": "GST", "Asia/Karachi": "PKT"
  };
  var zone = Intl.DateTimeFormat().resolvedOptions().timeZone;
  function zoneName(d) {
    if (ABBR[zone]) return ABBR[zone];
    var parts = new Intl.DateTimeFormat("en-US", { timeZoneName: "short" }).formatToParts(d);
    for (var i = 0; i < parts.length; i++) {
      if (parts[i].type === "timeZoneName") return parts[i].value;
    }
    return "";
  }

  function tick() {
    var d = new Date();
    var h = use24 ? pad(d.getHours()) : d.getHours() % 12 || 12;
    var ampm = use24 ? "24H" : (d.getHours() < 12 ? "AM" : "PM");
    document.getElementById("meta").textContent =
      d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate() + " " + DAYS[d.getDay()];
    document.getElementById("hms").textContent = h + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
    document.getElementById("ap").textContent = ampm;
    document.getElementById("tzn").textContent = zoneName(d);

    var s = Math.floor((d.getTime() - start) / 1000);
    var hh = Math.floor(s / 3600), mm = Math.floor(s / 60) % 60, ss = s % 60;
    // Only show minutes and hours once they are reached
    document.getElementById("stopwatch").textContent =
      hh > 0 ? hh + ":" + pad(mm) + ":" + pad(ss) : mm > 0 ? mm + ":" + pad(ss) : String(ss);
  }
  tick();
  setInterval(tick, 250);
  document.addEventListener("visibilitychange", tick);

  // Click AM/PM (or 24H) to switch between 12 and 24 hour time
  function toggle24() {
    use24 = !use24;
    try { localStorage.setItem("clock24", use24 ? "1" : "0"); } catch (e) {}
    tick();
  }
  document.getElementById("ap").addEventListener("click", toggle24);

  // Press Tab to switch between 12 and 24 hour time
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Tab" || e.ctrlKey || e.metaKey || e.altKey) return;
    e.preventDefault();
    document.documentElement.classList.add("keys");    // drop the hover highlight until the mouse moves
    toggle24();
  });
  document.addEventListener("mousemove", function () {
    document.documentElement.classList.remove("keys");
  });

  // Click the main clock to toggle full screen (AM/PM and time zone excluded)
  document.getElementById("clock").addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest("small")) return;
    try {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen();
      }
    } catch (e) {}
  });

  // In full screen, hide the cursor after 2 seconds without movement
  var idleTimer;
  function wake() {
    document.documentElement.classList.remove("idle");
    clearTimeout(idleTimer);
    if (document.fullscreenElement) {
      idleTimer = setTimeout(function () {
        document.documentElement.classList.add("idle");
      }, 2000);
    }
  }
  document.addEventListener("mousemove", wake);
  document.addEventListener("fullscreenchange", wake);

  // Keep the screen awake while this tab is visible
  var lock = null;
  async function keepAwake() {
    try {
      if ("wakeLock" in navigator && document.visibilityState === "visible") {
        lock = await navigator.wakeLock.request("screen");
      }
    } catch (e) {}
  }
  keepAwake();
  document.addEventListener("visibilitychange", keepAwake);
</script>
</body>
</html>
